steps:
  - name: Install Base Packages
    user: root
    check: |
      for pkg in sudo vim tree tcpdump conntrack traceroute nftables curl wget openssl ca-certificates gnupg qemu-guest-agent; do dpkg -s "$pkg"; done
    script: |
       apt install -y sudo vim tree tcpdump conntrack traceroute nftables curl wget openssl ca-certificates gnupg qemu-guest-agent
  - name: Configure Network Interfaces
    user: root
    env:
      - IP
      - GATEWAY
    check: |
      [ -e /etc/systemd/network/ens18.network ]
    script: |
      systemctl disable --now networking || :
      systemctl mask networking || :

      cat > /etc/network/interfaces <<-EOF
      auto lo
      iface lo inet loopback
      EOF

      cat > /etc/systemd/network/ens18.network <<-EOF
      [Match]
      Name=ens18

      [Network]
      Address=$IP
      Gateway=$GATEWAY
      DNS=$GATEWAY
      IPv6AcceptRA=no
      LinkLocalAddressing=no
      EOF

      systemctl unmask systemd-networkd systemd-networkd-wait-online || :

      systemctl restart systemd-networkd
      systemctl enable --now systemd-networkd systemd-networkd-wait-online

      systemctl start network-online.target
  - name: Install Podman
    user: root
    check: |
      dpkg -s podman
    script: |
      apt-get -y install podman
  - name: Create Users
    user: root
    for: USERS
    script: |
      id -u "$value" && exit 190 || :

      # requires default /etc/login.defs: SUB_UID_COUNT 65536  &&  SUB_GID_COUNT 65536
      useradd -rms /usr/sbin/nologin "$value"

      # Calculate next free 65536 block from existing /etc/subuid entries
      LAST_UID=$(tail -n 1 /etc/subuid | cut -d: -f2)
      LAST_COUNT=$(tail -n 1 /etc/subuid | cut -d: -f3)
      START_ID=$((LAST_UID + LAST_COUNT))
      END_ID=$((START_ID + 65535))

      usermod --add-subuids "${START_ID}-${END_ID}" --add-subgids "${START_ID}-${END_ID}" "$value"

      loginctl enable-linger "$value"

      mkdir -p "/home/$value/.config/containers"
      mkdir -p "/home/$value/quadlet"
      ln -s "/home/$value/quadlet" "/home/$value/.config/containers/systemd"

      cat >> "/home/$value/.bashrc" <<-'EOF'
      export XDG_RUNTIME_DIR="/run/user/$UID"
      export DBUS_SESSION_BUS_ADDRESS="unix:path=${XDG_RUNTIME_DIR}/bus"
      alias systemctl='systemctl --user'
      EOF

      chown -R "$value:$value" "/home/$value"

      cat >> /root/.bashrc <<-'EOF'
      user() {
        local target_user path_real

        if [[ -n "$1" ]]; then
            # Explicit user passed as argument
            target_user="$1"
        else
            # Fall back to path-based detection
            path_real="$(realpath -q "$PWD")"

            if [[ "$path_real" != /home/* ]]; then
                echo "Error: Not inside a /home tree and no target user specified." >&2
                ls -lh /home
                return 1
            fi

            target_user="$(echo "$path_real" | cut -d'/' -f3)"

            if [[ -z "$target_user" ]]; then
                echo "Error: Currently at root of /home, no target user detected." >&2
                return 1
            fi
        fi

        # Verify target user exists
        if ! id "$target_user" &>/dev/null; then
            echo "Error: User '$target_user' does not exist on this system." >&2
            return 1
        fi

        # Guard against switching to self
        if [[ "$target_user" == "$USER" ]]; then
            echo "Info: Already operating as user '$target_user'." >&2
            return 0
        fi

        # Execute shell switch
        [[ -n "$1 ]] && cd "/home/$target_user"
        sudo su -s /bin/bash "$target_user"
      }
      EOF
  - name: Configure Mosquitto MQTT Broker
    user: mosquitto
    check: |
      [ -e ~/quadlet/mosquitto.container ] && [ -e ~/config/mosquitto.conf ]
    script: |
      mkdir -p ~/{config,data}

      cat > ~/config/mosquitto.conf <<-EOF
      listener 1883
      allow_anonymous true
      EOF

      cat > ~/quadlet/mosquitto.container <<-EOF
      [Unit]
      Description=Mosquitto MQTT Broker

      [Container]
      ContainerName=mosquitto
      Image=docker.io/library/eclipse-mosquitto:latest
      Volume=/home/mosquitto/data:/mosquitto/data:U
      Volume=/home/mosquitto/config:/mosquitto/config:U
      PublishPort=1883:1883

      [Service]
      Restart=always

      [Install]
      WantedBy=default.target
      EOF

      systemctl --user daemon-reload
  - name: Start Mosquitto
    user: mosquitto
    check: |
      systemctl --user is-active mosquitto
    script: |
      systemctl --user daemon-reload
      systemctl --user start mosquitto