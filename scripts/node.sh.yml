steps:
  - ref: base
  - name: Starte Applikationsumgebung "hammer"
    user: root
    check: |
      [ -L /etc/haproxy ]
    script: |
      systemctl start user@955
  - name: Aktiviere DRBD Primary
    user: root
    check: |
      ! systemctl is-active user@955 || mount | grep -qE "^/dev/drbd0 "
    script: |
      drbdadm -- --overwrite-data-of-peer primary all
      [ -e /home ] && rm -rf /home || true
      mkdir -p /home
      mkfs -t ext4 /dev/drbd0
      mount /dev/drbd0 /home

      while ! drbdadm status | grep -qw 'disk:UpToDate' && ! drbdadm status | grep -qw 'peer-disk:UpToDate' ; do sleep 5 ; done
  - name: Konfiguriere /home/hammer
    user: root
    check: |
      ! systemctl is-active user@955
      [ -e /home/hammer/.config/containers ] && [ -e /home/hammer/quadlet ] && [ -e /home/hammer/.bashrc ] && [[ "$(stat -c '%a %u:%g' /home/hammer)" == '700 955:955' ]]
    script: |
      mkdir -p /home/hammer/.config/containers
      mkdir -p /home/hammer/quadlet
      ln -s /home/hammer/quadlet /home/hammer/.config/containers/systemd

      cat >> /home/hammer/.bashrc <<-'EOF'
      export XDG_RUNTIME_DIR="/run/user/$UID"
      export DBUS_SESSION_BUS_ADDRESS="unix:path=${XDG_RUNTIME_DIR}/bus"
      alias systemctl='systemctl --user'
      EOF

      chown -R hammer:hammer /home/hammer
      chmod 700 /home/hammer
  - name: Konfiguriere HAProxy
    user: root
    env:
      - DOMAIN
      - ACME_EMAIL
    check: |
      [ -L /etc/haproxy ]
    script: |
      mkdir -p /etc/haproxy/ssl

      cat > /etc/haproxy/acme.sh <<-'EOF'
      #!/bin/bash
      STATUS="$(echo "acme status" | socat stdio unix:/run/haproxy/admin.sock)"

      while IFS= read -r line; do
          printf '%s' "$line" | grep -qw '-' || continue
          DAYS="$(printf '%s' "$line" | grep -owE "[0-9]+d" | cut -dd -f1)"
          CERT="$(printf '%s' "$line" | grep - | cut -f1)"

          if [[ $DAYS -ge 30 ]]; then
              echo "Certificate \"$CERT\" is still valid for $DAYS days."
              continue
          else
              echo "acme renew $CERT" | socat stdio unix:/run/haproxy/admin.sock

              echo "Renewing Certificate \"$CERT\" with $DAYS days remaining."
              while [ "$(echo "acme status" | socat stdio unix:/run/haproxy/admin.sock | grep -w "$CERT" | grep -owE "[0-9]+d" | cut -dd -f1)" -le $DAYS ] ; do sleep 5; done

              cert="$(printf '%s' "$CERT" | cut -d/ -f2)"

              echo "dump ssl cert $CERT" | socat stdio unix:/run/haproxy/admin.sock > "/etc/haproxy/ssl/$cert"

              echo "Renewed Certificate \"$cert\" successfully!"

              # to avoid burst-renewal, wait for the next script iteration (ignore if initial)
              [[ $DAYS -gt 0 ]] && [[ "$1" != "all" ]] && exit 0
          fi
      done <<< "$STATUS"

      echo "All Certificates checked!"
      EOF

      cat > /etc/haproxy/haproxy.cfg <<-EOF
      global
       	log /dev/log	local0
       	log /dev/log	local1 notice
       	chroot /var/lib/haproxy
       	stats socket /run/haproxy/admin.sock mode 660 level admin
       	stats timeout 30s
       	user haproxy
       	group haproxy

       	expose-experimental-directives

       	acme.scheduler off

       	# See: https://ssl-config.mozilla.org/#server=haproxy&server-version=2.0.3&config=intermediate
       	ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
       	ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
       	ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets

      defaults
       	log	global
       	mode  http
       	option  httplog
       	option  dontlognull
       	timeout connect 30s
       	timeout client  600s
       	timeout server  600s
       	errorfile 400 /etc/haproxy/errors/400.http
       	errorfile 403 /etc/haproxy/errors/403.http
       	errorfile 408 /etc/haproxy/errors/408.http
       	errorfile 500 /etc/haproxy/errors/500.http
       	errorfile 502 /etc/haproxy/errors/502.http
       	errorfile 503 /etc/haproxy/errors/503.http
       	errorfile 504 /etc/haproxy/errors/504.http

      acme letsencrypt
        account-key /etc/haproxy/letsencrypt-account.key
        challenge http-01
        contact $ACME_EMAIL
        curves secp256r1
        directory https://acme-v02.api.letsencrypt.org/directory
        keytype ECDSA
        map virt@acme

      crt-store certs
        crt-base /etc/haproxy/ssl
        key-base /etc/haproxy/ssl
        load crt "$DOMAIN.pem" acme letsencrypt domains "$DOMAIN"

      frontend http-80
        bind :80
        http-request return status 200 content-type text/plain lf-string "%[path,field(-1,/)].%[path,field(-1,/),map(virt@acme)]\n" if { path_beg '/.well-known/acme-challenge/' }
        http-request redirect scheme https

      frontend https-443
        bind :443 ssl

        ssl-f-use crt "@certs/$DOMAIN.pem"

        option forwardfor
        http-request set-header X-Forwarded-Proto https
        http-request set-header X-Forwarded-Host %[req.hdr(Host)]
        http-request set-header X-Real-Ip %[src]

        default_backend homeassistant

      backend homeassistant
        server s1 127.0.0.1:8123

      listen mqtt
        mode tcp
        bind :8883 ssl

        ssl-f-use crt "@certs/$DOMAIN.pem"

        server s1 127.0.0.1:1883
      EOF

      mv /etc/haproxy /home/haproxy
      ln -s /home/haproxy /etc/haproxy
  - name: Starte HAProxy
    user: root
    check: |
      ! systemctl is-active user@955
    script: |
      systemctl is-active haproxy && systemctl reload haproxy || systemctl start haproxy
  - name: Konfiguriere internes Podman Netzwerk
    user: hammer
    script: |
      cat > ~/quadlet/hammer-net.network <<-EOF
      [Network]
      NetworkName=hammer-net
      Subnet=10.89.0.0/24
      Gateway=10.89.0.1
      EOF

      systemctl --user daemon-reload
  - name: Konfiguriere Quadlet - Mosquitto MQTT Broker
    user: hammer
    env:
      - MOSQUITTO_VERSION
    script: |
      cat > ~/quadlet/mosquitto.container <<-EOF
      [Unit]
      Description=Mosquitto MQTT Broker

      [Container]
      ContainerName=mosquitto
      Network=hammer-net.network
      Image=docker.io/library/eclipse-mosquitto:$MOSQUITTO_VERSION
      Volume=$HOME/mqtt/data:/mosquitto/data:U
      Volume=$HOME/mqtt/config:/mosquitto/config:U
      PublishPort=127.0.0.1:1883:1883

      [Service]
      Restart=always

      [Install]
      WantedBy=default.target
      EOF

      systemctl --user daemon-reload
  - name: Konfiguriere Applikation - Mosquitto MQTT Broker # TODO: acl & limit permissions for homeassistant/#
    user: hammer
    env:
      - $MQTT_HOME_PASS
      - $MQTT_DEVS_PASS
    check: |
      [ -e ~/mqtt/config/mosquitto.conf ] && [ -e ~/mqtt/config/acl.conf ] && [ -e ~/mqtt/config/pwds.conf ] && grep -q 'home:' ~/mqtt/config/pwds.conf && grep -q 'devs:' ~/mqtt/config/pwds.conf
    script: |
      mkdir -p ~/mqtt/{config,data}

      # allow_anonymous is only for educational/demonstrational purposes
      cat > ~/mqtt/config/mosquitto.conf <<-EOF
      listener 1883
      allow_anonymous true
      persistence true
      persistence_location /mosquitto/data
      autosave_interval 300
      EOF

      # anonymous read is only for educational/demonstrational purposes
      cat > ~/mqtt/config/acl.conf <<-EOF
      topic read #

      user home
      topic write homeassistant/status
      topic read homeassistant/+/+/config
      topic write homeassistant/+/+/command
      topic read homeassistant/+/+/state
      topic read home/+/availability

      user devs
      topic read dev/+/s
      topic write dev/+/c
      topic read homeassistant/status
      topic write homeassistant/+/+/config
      topic readwrite homeassistant/+/+/command
      topic readwrite homeassistant/+/+/state
      topic write home/+/availability
      EOF
  - name: Konfiguriere Quadlet - Home Assistant
    user: hammer
    env:
      - HOMEASSISTANT_VERSION
    script: |
      cat > ~/quadlet/homeassistant.container <<-EOF
      [Unit]
      Description=Home Assistant

      [Container]
      ContainerName=homeassistant
      Network=hammer-net.network
      Image=ghcr.io/home-assistant/home-assistant:$HOMEASSISTANT_VERSION
      Volume=$HOME/ha:/config:U
      Volume=/etc/localtime:/etc/localtime:ro
      Volume=/run/dbus:/run/dbus:ro
      Environment=TZ=Europe/Vienna
      PublishPort=127.0.0.1:8123:8123

      [Service]
      Restart=always

      [Install]
      WantedBy=default.target
      EOF

      systemctl --user daemon-reload
  - name: Konfiguriere Applikation - Home Assistant
    user: hammer
    env:
      - PVE_IP
      - PVE_ID1
      - PVE_ID2
      - $PVE_TOKEN
    check: |
      [ -e ~/ha/.storage/http ]
    script: |
      mkdir -p ~/ha/.storage

      cat > ~/ha/configuration.yaml <<-EOF
      # Loads default set of integrations. Do not remove.
      default_config:

      # Load frontend themes from the themes folder
      frontend:
        themes: !include_dir_merge_named themes

      automation: !include automations.yaml
      script: !include scripts.yaml
      scene: !include scenes.yaml

      sensor:
        - platform: rest
          resource: "https://$PVE_IP:8006/api2/json/nodes/pve/qemu/$VM_ID1/status/current"
          method: GET
          verify_ssl: false
          name: Node1 Status
          unique_id: pve_node1_status
          headers:
            Authorization: !secret pvetoken
          value_template: '{{ value_json.data.status }}'
          scan_interval: 5
          json_attributes_path: '$.data'
          json_attributes:
            - cpu
            - mem
            - uptime
            - diskread
            - diskwrite
            - netin
            - netout

        - platform: rest
          resource: "https://$PVE_IP:8006/api2/json/nodes/pve/qemu/$VM_ID2/status/current"
          method: GET
          verify_ssl: false
          name: Node2 Status
          unique_id: pve_node2_status
          headers:
            Authorization: !secret pvetoken
          value_template: '{{ value_json.data.status }}'
          scan_interval: 5
          json_attributes_path: '$.data'
          json_attributes:
            - cpu
            - mem
            - uptime
            - diskread
            - diskwrite
            - netin
            - netout

      template:
        - sensor:
            - name: "Node1 CPU"
              unique_id: pve_node1_cpu
              unit_of_measurement: "%"
              state_class: measurement
              state: >
                {% set v = state_attr('sensor.node1_status', 'cpu') %}
                {{ (v * 100) | round(2) if v is not none else 'N/A' }}

            - name: "Node1 Memory"
              unique_id: pve_node1_memory
              unit_of_measurement: "GB"
              state_class: measurement
              state: >
                {% set v = state_attr('sensor.node1_status', 'mem') %}
                {{ (v / 1073741824) | round(2) if v is not none else 'N/A' }}

            - name: "Node1 Disk Read"
              unique_id: pve_node1_disk_read
              unit_of_measurement: "MB"
              state_class: measurement
              state: >
                {% set v = state_attr('sensor.node1_status', 'diskread') %}
                {{ (v / 1048576) | round(2) if v is not none else 'N/A' }}

            - name: "Node1 Disk Write"
              unique_id: pve_node1_disk_write
              unit_of_measurement: "MB"
              state_class: measurement
              state: >
                {% set v = state_attr('sensor.node1_status', 'diskwrite') %}
                {{ (v / 1048576) | round(2) if v is not none else 'N/A' }}

            - name: "Node1 Net In"
              unique_id: pve_node1_net_in
              unit_of_measurement: "MB"
              state_class: measurement
              state: >
                {% set v = state_attr('sensor.node1_status', 'netin') %}
                {{ (v / 1048576) | round(2) if v is not none else 'N/A' }}

            - name: "Node1 Net Out"
              unique_id: pve_node1_net_out
              unit_of_measurement: "MB"
              state_class: measurement
              state: >
                {% set v = state_attr('sensor.node1_status', 'netout') %}
                {{ (v / 1048576) | round(2) if v is not none else 'N/A' }}

            - name: "Node1 Uptime"
              unique_id: pve_node1_uptime
              unit_of_measurement: "h"
              state_class: measurement
              icon: mdi:timer-outline
              state: >
                {% set s = state_attr('sensor.node1_status', 'uptime') %}
                {{ (s / 3600) | round(2) if s is not none and s > 0 else 0 }}

            - name: "Node2 CPU"
              unique_id: pve_node2_cpu
              unit_of_measurement: "%"
              state_class: measurement
              state: >
                {% set v = state_attr('sensor.node2_status', 'cpu') %}
                {{ (v * 100) | round(2) if v is not none else 'N/A' }}

            - name: "Node2 Memory"
              unique_id: pve_node2_memory
              unit_of_measurement: "GB"
              state_class: measurement
              state: >
                {% set v = state_attr('sensor.node2_status', 'mem') %}
                {{ (v / 1073741824) | round(2) if v is not none else 'N/A' }}

            - name: "Node2 Disk Read"
              unique_id: pve_node2_disk_read
              unit_of_measurement: "MB"
              state_class: measurement
              state: >
                {% set v = state_attr('sensor.node2_status', 'diskread') %}
                {{ (v / 1048576) | round(2) if v is not none else 'N/A' }}

            - name: "Node2 Disk Write"
              unique_id: pve_node2_disk_write
              unit_of_measurement: "MB"
              state_class: measurement
              state: >
                {% set v = state_attr('sensor.node2_status', 'diskwrite') %}
                {{ (v / 1048576) | round(2) if v is not none else 'N/A' }}

            - name: "Node2 Net In"
              unique_id: pve_node2_net_in
              unit_of_measurement: "MB"
              state_class: measurement
              state: >
                {% set v = state_attr('sensor.node2_status', 'netin') %}
                {{ (v / 1048576) | round(2) if v is not none else 'N/A' }}

            - name: "Node2 Net Out"
              unique_id: pve_node2_net_out
              unit_of_measurement: "MB"
              state_class: measurement
              state: >
                {% set v = state_attr('sensor.node2_status', 'netout') %}
                {{ (v / 1048576) | round(2) if v is not none else 'N/A' }}

            - name: "Node2 Uptime"
              unique_id: pve_node2_uptime
              unit_of_measurement: "h"
              state_class: measurement
              icon: mdi:timer-outline
              state: >
                {% set s = state_attr('sensor.node2_status', 'uptime') %}
                {{ (s / 3600) | round(2) if s is not none and s > 0 else 0 }}

      rest_command:
        reboot_node1:
          url: "https://$PVE_IP:8006/api2/json/nodes/pve/qemu/$PVE_ID1/status/reboot"
          method: post
          verify_ssl: false
          headers:
            Authorization: !secret pvetoken
        reboot_node2:
          url: "https://$PVE_IP:8006/api2/json/nodes/pve/qemu/$PVE_ID2/status/reboot"
          method: post
          verify_ssl: false
          headers:
            Authorization: !secret pvetoken
      EOF

      cat > ~/ha/secrets.yaml <<-EOF
      # Learn more at https://www.home-assistant.io/docs/configuration/secrets/
      pvetoken: PVEAPIToken=$PVE_TOKEN
      EOF

      cat > ~/ha/.storage/http <<-EOF
      {
        "version": 2,
        "minor_version": 2,
        "key": "http",
        "data": {
          "stable": {
            "server_port": 8123,
            "use_x_forwarded_for": true,
            "trusted_proxies": [
              "10.89.0.0/24"
            ],
            "cors_allowed_origins": [
              "https://cast.home-assistant.io"
            ],
            "login_attempts_threshold": -1,
            "ip_ban_enabled": true,
            "ssl_profile": "modern",
            "use_x_frame_options": true,
            "created_at": "2026-10-03T17:23:51.435577+00:00",
            "error": "not_promoted",
            "error_message": null
          },
          "pending": {
            "server_port": 8123,
            "use_x_forwarded_for": true,
            "trusted_proxies": [
              "10.89.0.0/24"
            ],
            "cors_allowed_origins": [
              "https://cast.home-assistant.io"
            ],
            "login_attempts_threshold": -1,
            "ip_ban_enabled": true,
            "ssl_profile": "modern",
            "use_x_frame_options": true,
            "created_at": "2026-10-03T17:23:51.435577+00:00",
            "error": "not_promoted",
            "error_message": null
          },
          "yaml_migration_done": true
        }
      }
      EOF

      systemctl --user daemon-reload
  - name: Starte Mosquitto
    user: hammer
    script: |
      systemctl --user daemon-reload
      systemctl --user restart mosquitto
  - name: Konfiguriere MQTT Benutzer
    user: hammer
    check: |
      [ -e ~/mqtt/config/pwds.conf ]
    script: |
      cat >> ~/mqtt/config/mosquitto.conf <<-EOF
      password_file /mosquitto/config/pwds.conf
      acl_file /mosquitto/config/acl.conf
      EOF

      podman exec mosquitto mosquitto_passwd -cb /mosquitto/config/pwds.conf home "$MQTT_HOME_PASS"
      podman exec mosquitto mosquitto_passwd -b /mosquitto/config/pwds.conf devs "$MQTT_DEVS_PASS"

      systemctl --user restart mosquitto
  - name: Starte Home Assistant
    user: hammer
    script: |
      systemctl --user daemon-reload
      systemctl --user restart homeassistant
  - ref: cluster
  - name: Authentifiziere Cluster Nodes
    user: root
    env:
      - IP1
      - IP2
      - $SECRET
    script: |
      pcs host auth node1 addr="$IP1" node2 addr="$IP2" -u hacluster -p "$SECRET"
  - name: Erstelle Cluster "ham"
    user: root
    env:
      - IP1
      - IP2
    check: |
      [[ -z "$(pcs property config stonith-enabled | grep -o '(default)')" ]]
    script: |
      pcs cluster setup ham node1 addr="$IP1" node2 addr="$IP2" transport udpu --start --enable --force

      # TODO: add optional proxmox stonith
      pcs property set stonith-enabled=false
  - name: Konfiguriere Cluster Ressourcen
    user: root
    env:
      - VIP
    check: |
      pcs status query resource apps exists
    script: |
      pcs resource create drbd ocf:linbit:drbd drbd_resource="r0" op monitor interval="20s" role="Promoted" op monitor interval="40s" role="Unpromoted" \
          promotable promoted-max=1 promoted-node-max=1 clone-max=2 clone-node-max=1 notify=true

      pcs resource create vip systemd:ens19 op monitor interval=10s meta priority=10

      pcs resource create data filesystem device="/dev/drbd0" directory="/home" fstype="ext4"

      pcs resource create proxy systemd:haproxy op monitor interval=10s

      pcs resource create acme systemd:acme.timer op monitor interval=10s

      pcs resource create apps systemd:user@955 op monitor interval=10s
  - name: Konfiguriere Cluster Colocation
    user: root
    check: |
      pcs constraint colocation | grep -q "resource 'apps' with"
    script: |
      pcs constraint colocation add vip with Promoted drbd-clone score=INFINITY
      pcs constraint colocation add data with Promoted drbd-clone score=INFINITY
      pcs constraint colocation add proxy with data score=INFINITY
      pcs constraint colocation add acme with proxy score=INFINITY
      pcs constraint colocation add apps with data score=INFINITY
  - name: Konfiguriere Cluster Reihenfolge
    user: root
    check: |
      pcs constraint order | grep -q "then start resource 'apps'"
    script: |
      pcs constraint order promote drbd-clone then start vip
      pcs constraint order promote drbd-clone then start data
      pcs constraint order start data then start proxy
      pcs constraint order start proxy then start acme
      pcs constraint order start data then start apps
  - name: Konfiguriere Proxmox STONITH
    user: root
    # skip: Möchten Sie den Cluster für STONITH über Proxmox konfigurieren?
    env:
      - PVE_IP
      - PVE_NODE
      - PVE_ID1
      - PVE_ID2
      - PVE_USER
      - $PVE_PASS
    check: |
      [[ -z "$(pcs property config priority-fencing-delay | grep -o '(default)')" ]]
    script: |
      pcs stonith create fence-node1 fence_pve ip=$PVE_IP ssl_insecure=1 pve_node=$PVE_NODE vmtype=qemu username=$PVE_USER password=$PVE_PASS pcmk_host_list=node1 plug=$PVE_ID1

      pcs stonith create fence-node2 fence_pve ip=$PVE_IP ssl_insecure=1 pve_node=$PVE_NODE vmtype=qemu username=$PVE_USER password=$PVE_PASS pcmk_host_list=node2 plug=$PVE_ID2

      pcs constraint location fence-node1 avoids node1=INFINITY
      pcs constraint location fence-node2 avoids node2=INFINITY

      pcs property set stonith-enabled=true
      pcs property set stonith-timeout=60s
      pcs property set stonith-action=reboot
      pcs property set no-quorum-policy=ignore
      pcs property set priority-fencing-delay=2s
  - name: Warte auf Cluster
    user: root
    script: |
      while ! pcs status query resource apps is-state started ; do sleep 5 ; done
  - name: Prüfe Cluster Aktiv-Passiv Tausch
    user: root
    skip: Möchten Sie eine automatische Prüfung des Wechselvorgangs vom/zum passiven Node durchführen?
    script: |
      active="$(pcs status query resource vip get-nodes)"
      passive=""
      if [[ "$active" == "node1" ]]; then
          passive="node2"
      elif [[ "$active" == "node2" ]]; then
          passive="node1"
      else
          echo "Ressource 'vip' is auf einem ungültigen node '$active'!"
          exit 1
      fi

      pcs node standby $active
      while ! pcs status query resource apps is-state started on-node $passive; do sleep 5 ; done
      pcs node unstandby $active

      # schauen ob's immer noch läuft
      sleep 10
      pcs status query resource apps is-state started on-node $passive

      sleep 10
      pcs node standby $passive
      while ! pcs status query resource apps is-state started on-node $active; do sleep 5 ; done
      pcs node unstandby $passive
  - name: Prüfe Cluster Fencing Passive
    user: root
    skip: Möchten Sie eine automatische Prüfung des STONITH Fencing Agents am passiven Node durchführen?
    script: |
      active="$(pcs status query resource vip get-nodes)"
      passive=""
      if [[ "$active" == "node1" ]]; then
          passive="node2"
      elif [[ "$active" == "node2" ]]; then
          passive="node1"
      else
          echo "Ressource 'vip' is auf einem ungültigen node '$active'!"
          exit 1
      fi

      pcs stonith fence $passive
      while pcs cluster status | grep -qw "$passive: Offline"; do sleep 1 ; done
      while ! pcs status query resource fence-$active is-state started on-node $passive; do sleep 5 ; done
  - name: Prüfe Cluster STONITH Failover
    user: root
    skip: Möchten Sie einen Netzwerkverlust simulieren, um STONITH zu testen? (diese VM wird neugestartet)
    script: |
      nft add table inet isolate
      nft add chain inet isolate input '{ type filter hook input priority 0; policy drop; }'